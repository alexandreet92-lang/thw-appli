<!DOCTYPE html><html lang="fr"><head>
  <!-- Icônes : chemins ABSOLUS. En relatif (« assets/logo.png ») l'icône
       cassait dès que la page n'était pas servie depuis /site/, ce qui est le
       cas à la racine du domaine — d'où l'absence de logo dans Google. -->
  <link rel="icon" href="/favicon.ico" sizes="any"/>
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#070b0f"/>



  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Questionnaire — THW Coaching</title>
  <link rel="stylesheet" href="colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; }
    input, textarea, select, button { font-family: inherit; }
    input::placeholder, textarea::placeholder { color: var(--text-dim); }
    select option { background: #0c1118; color: var(--text); }
    a { color: inherit; }

    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 70% 55% at 15% 40%, rgba(0,200,224,0.045) 0%, transparent 70%),
        radial-gradient(ellipse 55% 65% at 85% 15%, rgba(91,111,255,0.055) 0%, transparent 70%);
    }
    #root { position: relative; z-index: 1; }

    /* Range slider */
    input[type="range"] { -webkit-appearance: none; width: 100%; height: 4px; background: rgba(255,255,255,0.10); border-radius: 2px; outline: none; cursor: pointer; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(135deg, #00c8e0, #5b6fff); cursor: pointer; box-shadow: 0 0 14px rgba(0,200,224,0.55); transition: transform 0.15s; }
    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }
    input[type="range"]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(135deg, #00c8e0, #5b6fff); cursor: pointer; border: none; box-shadow: 0 0 14px rgba(0,200,224,0.55); }

    @keyframes qFadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes qFadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
<link rel="stylesheet" href="stade.css"/>
  <script src="stade.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- i18n — FR (source) / EN / ES. TOUS les dictionnaires sont chargés sur
       TOUTES les pages : une page qui n'en charge qu'une partie laisse des
       textes en français quand on bascule en EN/ES, et une page qui ne charge
       pas i18n.js du tout affiche un sélecteur de langue qui ne fait rien. -->
  <!-- Session + compte partagés : doit être chargé AVANT i18n.js, qui lit la
